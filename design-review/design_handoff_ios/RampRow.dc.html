<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="display:flex;align-items:center;justify-content:space-between;min-height:62px;padding:10px 14px;box-sizing:border-box;font-family:var(--font-body,Archivo),system-ui,sans-serif;background:{{ bg }};border:2px solid {{ border }};color:{{ fg }};opacity:{{ dim }};">
  <div style="min-width:0;">
    <div style="font-size:22px;font-weight:800;letter-spacing:-0.015em;line-height:1.05;text-wrap:pretty;">{{ name }}</div>
    <div style="font-size:11px;margin-top:3px;opacity:0.7;">{{ since }}</div>
  </div>
  <div style="display:flex;align-items:center;gap:8px;flex:none;padding-left:12px;">
    <div style="width:10px;height:20px;background:{{ mark }};"></div>
    <span style="font-size:15px;font-weight:800;">{{ word }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:366,&quot;height&quot;:66},
&quot;ramp&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Beachway Ave&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;status&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;open&quot;,&quot;limited&quot;,&quot;closed&quot;],&quot;default&quot;:&quot;open&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;since&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;Open since 6:02 AM&quot;,&quot;tsType&quot;:&quot;string&quot;},
&quot;night&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},
&quot;stale&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props;
    const night = p.night === true || p.night === "true";
    const status = p.status || "open";
    const open = night
      ? { bg: "rgba(4,24,34,0.55)", border: "rgba(255,255,255,0.30)", fg: "#ffffff", mark: "#2AE07A" }
      : { bg: "#ffffff", border: "rgba(32,30,29,0.85)", fg: "#201e1d", mark: "#0A7A42" };
    const field = {
      open,
      limited: { bg: "#F5A214", border: "#F5A214", fg: "#241500", mark: "#241500" },
      closed: night
        ? { bg: "#E63A2B", border: "#E63A2B", fg: "#ffffff", mark: "#ffffff" }
        : { bg: "#D22B18", border: "#D22B18", fg: "#ffffff", mark: "#ffffff" }
    }[status];
    return {
      ...field,
      name: p.ramp || "Ramp",
      since: p.since || "",
      word: { open: "Open", limited: "Limited", closed: "Closed" }[status],
      dim: p.stale === true || p.stale === "true" ? 0.45 : 1
    };
  }
}
</script>
</body>
</html>
