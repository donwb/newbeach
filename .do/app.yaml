name: beach-ramp-status
region: nyc
# DNS is managed in Cloudflare (no zone field): CNAME beach -> the app's
# default ondigitalocean.app hostname. Start the record DNS-only (grey cloud)
# until DO finishes TLS validation, then proxying can be enabled.
domains:
  - domain: beach.donwb.com
    type: PRIMARY
services:
  - name: beach-api
    github:
      repo: donwb/newbeach
      branch: main
      deploy_on_push: true
    dockerfile_path: api/Dockerfile
    source_dir: /
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /api/v2/health
    envs:
      - key: DATABASE_URL
        type: SECRET
      - key: GIS_HOST
        value: maps5.vcgov.org
      - key: POLL_INTERVAL
        value: "60"
      - key: LOG_LEVEL
        value: info
      - key: WEBCAM_URL
        value: "https://kubrick.htvapps.com/htv-prod-media.s3.amazonaws.com/images/dynamic/wesh/CAM13.jpg"
      - key: NOAA_TIDE_STATION
        value: "8721147"
      - key: NOAA_TEMP_STATIONS
        value: "8721604,8720218"
      - key: ADMIN_API_KEY
        type: SECRET
        value: "CHANGE_ME_IN_PLATFORM_UI"
