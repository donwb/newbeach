<!DOCTYPE html>
<html lang="en" data-ground="day">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Beach Ramp Status — Volusia County</title>
  <meta name="description" content="Real-time beach access ramp status, tide data, and water temperature for Volusia County, Florida.">
  <link rel="manifest" href="/manifest.json">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#0A1420">
  <link rel="preload" href="/fonts/archivo-800.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="/fonts/archivo-400.woff2" as="font" type="font/woff2" crossorigin>
  <!-- ?v= busts the browser's heuristic HTTP cache; bump alongside sw.js CACHE_NAME. -->
  <link rel="stylesheet" href="/styles.css?v=11">
</head>
<body>
  <div id="ground" aria-hidden="true"></div>
  <a id="county-note" href="/county/">
    <span class="cn-q">Here from Volusia County?</span>
    <span class="cn-a">What this is &amp; who built it &rarr;</span>
  </a>
  <style>
    /* County-visitor note: static strip above the app, tokens from styles.css. */
    #county-note {
      position: relative;
      z-index: 1;
      display: flex;
      justify-content: center;
      align-items: baseline;
      gap: 10px;
      padding: 9px var(--pad, 40px);
      font-family: var(--font, system-ui, sans-serif);
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink, #201e1d);
      border-bottom: 2px solid var(--rule, #201e1d);
    }
    #county-note .cn-a { color: var(--accent, #ec3013); }
    #county-note:hover .cn-a { text-decoration: underline; }
  </style>
  <main id="view"></main>
  <noscript>
    <p style="padding: 40px; font-family: system-ui, sans-serif;">
      Beach Ramp Status needs JavaScript to show live ramp, tide, and cam data.
    </p>
  </noscript>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
  <script type="module" src="/app.js?v=11"></script>
</body>
</html>
